<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今天吃什麼？抽籤器</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: linear-gradient(135deg, #fff7ed, #fef3c7);
      color: #292524;
    }
    .app {
      width: min(100%, 520px);
      padding: 30px;
      background: #ffffff;
      border-radius: 22px;
      box-shadow: 0 12px 35px rgba(120, 53, 15, 0.12);
    }
    h1 { margin: 0 0 8px; text-align: center; font-size: 28px; }
    .subtitle { margin: 0 0 24px; text-align: center; color: #78716c; }
    label { display: block; margin-bottom: 9px; font-weight: 700; }
    textarea {
      width: 100%;
      min-height: 160px;
      resize: vertical;
      padding: 14px;
      border: 2px solid #fed7aa;
      border-radius: 12px;
      font: inherit;
      font-size: 16px;
      line-height: 1.7;
      outline: none;
    }
    textarea:focus { border-color: #f97316; }
    .hint { margin: 8px 0 18px; color: #78716c; font-size: 13px; }
    button {
      width: 100%;
      padding: 14px 18px;
      border: 0;
      border-radius: 12px;
      background: #ea580c;
      color: white;
      font: inherit;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s, transform .2s;
    }
    button:hover { background: #c2410c; }
    button:active { transform: scale(.98); }
    .result {
      margin-top: 22px;
      min-height: 110px;
      display: grid;
      place-items: center;
      padding: 20px;
      text-align: center;
      background: #fff7ed;
      border: 2px dashed #fdba74;
      border-radius: 14px;
    }
    .result-title { color: #9a3412; font-size: 14px; font-weight: 700; }
    #resultText { margin-top: 8px; font-size: 28px; font-weight: 800; overflow-wrap: anywhere; }
    #resultText.error { font-size: 16px; color: #b91c1c; }
  </style>
</head>
<body>
  <main class="app">
    <h1>今天吃什麼？</h1>
    <p class="subtitle">把選項交給抽籤器決定吧！</p>

    <label for="options">輸入今天想吃的選項（每行一個）</label>
    <textarea id="options" placeholder="例如：&#10;便當&#10;麵&#10;咖哩&#10;水餃">便當
麵
咖哩
水餃</textarea>
    <p class="hint">空白行會自動忽略；完全相同的選項只保留一次。</p>

    <button id="pickButton" type="button">幫我選</button>

    <section class="result" aria-live="polite" aria-atomic="true">
      <div>
        <div class="result-title">🎉 今天的幸運餐點是</div>
        <div id="resultText">等你來抽籤！</div>
      </div>
    </section>
  </main>

  <script>
    const optionsInput = document.getElementById("options");
    const pickButton = document.getElementById("pickButton");
    const resultText = document.getElementById("resultText");

    pickButton.addEventListener("click", function () {
      // 去除每行前後空白、空白行，並移除完全相同的重複選項
      const options = [...new Set(
        optionsInput.value
          .split("\n")
          .map(item => item.trim())
          .filter(item => item !== "")
      )];

      if (options.length === 0) {
        resultText.textContent = "請先輸入至少一個選項";
        resultText.classList.add("error");
        return;
      }

      // 每個有效選項的中籤機率相同
      const randomIndex = Math.floor(Math.random() * options.length);
      resultText.textContent = options[randomIndex];
      resultText.classList.remove("error");
    });
  </script>
</body>
</html>
